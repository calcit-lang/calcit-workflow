name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: "enable Yarn"
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: "install modules"
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: "validate snapshots and entries"
      run: |
        set -euo pipefail
        test -f calcit.cirru
        test -f deps.cirru
        test ! -e compact.cirru
        test ! -e package.cirru
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru --entry test --check-only
        calcit calcit.cirru analyze check-public --ns app.main --ns app.test --summary-only

    - name: "test native"
      run: calcit calcit.cirru --entry test

    - name: "test JavaScript"
      run: |
        calcit calcit.cirru --entry test js
        node ./main.mjs
