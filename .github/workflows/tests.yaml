name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: "enable Yarn"
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1

    - name: "install modules"
      run: caps --strict --ci

    - name: "validate snapshots and entries"
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru --entry test --check-only
        calcit calcit.cirru analyze dynamic-methods --max 0
        calcit --entry test calcit.cirru analyze dynamic-methods --max 0
        calcit calcit.cirru analyze check-types --summary-only --format json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
        calcit calcit.cirru analyze deprecated --summary-only --format json

    - name: "test JavaScript"
      run: |
        calcit calcit.cirru --entry test js
        yarn install --immutable
        node ./main.mjs
