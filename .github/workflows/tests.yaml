name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: "enable Yarn"
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru

    - name: "install modules"
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: "validate snapshots and entries"
      run: |
        set -euo pipefail
        test -f calcit.cirru
        test -f deps.cirru
        test ! -e compact.cirru
        test ! -e package.cirru
        calcit calcit.cirru edit format
        git diff --exit-code --quiet -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
        calcit calcit.cirru --entry test --check-only
        calcit calcit.cirru --check-only --ns app.main --ns app.test --summary-only

    - name: "test native"
      run: calcit calcit.cirru --entry test

    - name: "run native timer demo"
      run: |
        set -euo pipefail
        status=0
        timeout 5s calcit calcit.cirru > .calcit/timer-demo.log 2>&1 || status=$?
        cat .calcit/timer-demo.log
        test "$status" -eq 124
        grep -F 'todo bcc' .calcit/timer-demo.log

    - name: "test JavaScript"
      run: |
        calcit calcit.cirru --entry test js
        node ./main.mjs
